[project]
name = "ns-tool"
version = "0.1.0"
description = "Mijn NS work-trip pre-selector -- selects work-relevant declaration checkboxes for manual review/download."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.44",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
ns-select = "ns_tool.cli:main"
[tool.setuptools]
packages = ["ns_tool"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "ns_tool.*"
strict = true

# Tests favor readability (untyped fixtures/helpers) over strict typing.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
