# Station names that mark a trip (or a leg of a multi-leg journey) as
# work-related. Substring match against the station text on the page, so
# "Sliedrecht" also matches "Sliedrecht, Station Baanhoek".
work_stations:
  - Sliedrecht
  - Ketelhaven

# Max minutes allowed between one leg's checkout and the next leg's
# checkin for them to still count as one journey (e.g. a metro-to-bus
# transfer). Raise this if your real transfers are getting split into
# separate chains; lower it if unrelated trips are getting merged.
max_gap_minutes: 20
